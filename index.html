<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .box {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 520px;
      line-height: 1.7;
      font-size: 1.15rem;
    }
    strong {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <p><strong>알려드립니다.</strong></p>
    <p>이 페이지는 제 인삿말과 공약을 소개하는 공간으로 운영되어 왔습니다.</p>
    <p>저는 대의원대회 합의 내용을 기준으로 안내를 드려왔으나 일부에서 형평성 관련 의견이 제시되었고 선거관리위원회의 권고가 있었습니다.</p>
    <p>이에 따라 영상을 임시 중단하게 되었으며 혼선을 드린 점 너른 이해를 부탁드립니다.</p>
    <p>추후 안내를 통해 다시 알려드리겠습니다.</p>
  </div>
</body>
</html>
